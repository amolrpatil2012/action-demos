name: second
on: workflow_dispatch
jobs:
  java-build:
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout
        uses: actions/checkout@v4    
        
      - name: Install Java  
        uses: actions/setup-java@6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          
      - name: run java code 
        run: mvn -B package 

      - name: Copy JAR files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Get-ChildItem -Path . -Filter *.jar -Recurse |
            Where-Object { $_.FullName -match '[\\/]target[\\/]' } |
            Copy-Item -Destination staging

      - name: Publish Artifact
        uses: actions/upload-artifact@v4  
        with:
          name: drop
          path: staging/*.jar

        
      
  
